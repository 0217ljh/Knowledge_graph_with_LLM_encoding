E2E-graph: &E2E-graph
  task_level: e2e_graph
  eval_pool_mode: mean
  eval_set_constructs:
    - stage: train
      split_name: train
      dataset: 'Small_Molecules'
    - stage: valid
      split_name: valid
      dataset: 'Small_Molecules'
    - stage: test
      split_name: test
      dataset: 'Small_Molecules'
    - stage: test
      split_name: train
      dataset: 'Small_Molecules'
    - stage: test
      split_name: valid
      dataset: 'Small_Molecules'

E2E-edge: &E2E-edge
  task_level: e2e_edge
  eval_pool_mode: mean
  eval_set_constructs:
