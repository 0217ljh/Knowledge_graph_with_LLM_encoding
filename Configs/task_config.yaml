      dataset: 'Small_Molecules'
    - stage: test
      split_name: train
      dataset: 'Small_Molecules'
    - stage: test
      split_name: valid
      dataset: 'Small_Molecules'

E2E-node: &E2E-node
  task_level: e2e_node
  eval_pool_mode: mean
  eval_set_constructs:
    - stage: train
      split_name: train
      dataset: 'Small_Molecules'
    - stage: valid
      split_name: valid
      dataset: 'Small_Molecules'
    - stage: test
      split_name: test
      dataset: 'Small_Molecules'
    - stage: test
      split_name: train
      dataset: 'Small_Molecules'
    - stage: test
      split_name: valid
      dataset: 'Small_Molecules'



Task1_Small_Molecules: &Task1_Small_Molecules
